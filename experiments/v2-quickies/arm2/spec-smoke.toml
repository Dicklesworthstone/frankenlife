schema = "frankenlife.experiment.v1"
name = "v2-quickie-arm2-tissue-morphogenesis-smoke64"
hypothesis = """V2-10 Quickie Arm 2 CI smoke specification (64x64, h = D = 0.25, 256 ticks, \
1 discovery + 1 held-out seed): verifies that the exact Arm 2 treatment and all five \
implemented controls (v1-compat, no-hippo-crowding, frozen-polarity, no-tight-junctions, \
uniform-low-diffusion) execute cleanly end-to-end through flife experiment with zero \
invariant faults. Smoke mode establishes implementation/rules execution only, never \
ecological tissue/H4 support."""
base = "../arm2-tissue-morphogenesis-smoke64.toml"
ticks = 256
metrics_every = 128
control = "treatment"
selection = "No selection: CI smoke mode runs every condition on 1 discovery and 1 held-out seed and catalogs every ending."

[seeds]
discovery = [201]
held_out = [2201]

[[conditions]]
name = "treatment"

[[conditions]]
name = "v1-compat"
set = { "v2.polarity.enabled" = false, "v2.crowding.enabled" = false, "v2.barrier.enabled" = false, "v2.visual.enabled" = false }

[[conditions]]
name = "no-hippo-crowding"
set = { "v2.crowding.enabled" = false }

[[conditions]]
name = "frozen-polarity"
set = { "v2.polarity.torque_mobility" = 0.0, "v2.polarity.oriented_lateral_mitosis" = false }

[[conditions]]
name = "no-tight-junctions"
set = { "v2.barrier.enabled" = false }

[[conditions]]
name = "uniform-low-diffusion"
set = { "v2.barrier.enabled" = false, "world.diffusion" = 0.001194868 }
