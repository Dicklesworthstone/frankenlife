[package]
name = "flife-studio"
description = "FrankenLife's interactive Studio shell: the live world through FrankenManim's native Metal preview, with typed native pointer, key, scroll, focus and resize input, and the session owner on its own Asupersync thread behind a bounded intent lane"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "flife-studio"
path = "src/main.rs"

# Runtime, the Manim adapter and FrankenManim's Metal preview (plan §18.1).
[dependencies]
asupersync.workspace = true
clap.workspace = true
flife-backend-metal = { path = "../flife-backend-metal" }
flife-core = { path = "../flife-core" }
flife-engine = { path = "../flife-engine" }
# The material brush's unit composition is a source direction's (FL-022).
flife-field = { path = "../flife-field" }
# The colour key labels the run's topology catalog (FL-019).
flife-genome = { path = "../flife-genome" }
flife-manim = { path = "../flife-manim" }
flife-render = { path = "../flife-render" }
flife-runtime = { path = "../flife-runtime" }
# FL-023's export: fmn-codec's PNG and y4m, already in the closure through
# fmn and flife-cli.
fmn-codec.workspace = true
# An offscreen frame is read back as FrankenManim's frame buffer (FL-024),
# and an export's video frames are converted by its rgba_to_nv12 (FL-023).
fmn-frame.workspace = true
fmn-render = { workspace = true, features = ["metal"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
fmn-render = { workspace = true, features = ["metal"] }
# The frame-upload measurement counts the heap a Metal frame holds (FL-043).
peak_alloc.workspace = true

[features]
# Test seam: `Studio::post` posts real AppKit events into the application
# queue (FrankenManim's and frankentorch's `synthetic-input`). Only the live
# test enables it; never a shipped build.
synthetic-input = ["fmn-render/synthetic-input"]

# Opens a real window on the main thread, so it runs without the libtest
# harness: `cargo test -p flife-studio --features synthetic-input --test live`.
[[test]]
name = "live"
harness = false
required-features = ["synthetic-input"]

[lints]
workspace = true
