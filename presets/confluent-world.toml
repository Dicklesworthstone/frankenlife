# confluent-world: contact-world with a field four times finer than its organisms' spacing, food to spare
# and scattered offspring, so its tissue fills the torus.
#
# Category: an outer-searched parameter set (plan §2.4, §7.2, §15.5) under the
# registered model variant field-ecology-v1-contact (plan §5.4), the model of
# presets/contact-world.toml, whose search it continues. It was chosen
# outside the world: trials were run, their frames scored against image
# statistics of the reference screenshots, and a person chose among them by
# eye. Nothing the search computed feeds back into a run: the world has no
# aesthetic fitness, and its organisms live, split, emit and die by energy
# alone. It is not a selected seed (experiments/showcase/README.md reports
# held-out seeds), not an evolved population and not a viability
# calibration, and it makes no claim that the world persists indefinitely.
#
# The rules are contact-world's; only the scale and three ecological
# parameters differ. The selection (experiments/showcase/README.md, "Stage
# E", has every trial):
#   1. contact-world puts about eleven organisms in each field cell, the
#      references about one, so its field-made structure spans dozens of
#      organisms. Every length the organisms and the field act on was made
#      four times finer (grid spacing, diffusion length, speeds and
#      accelerations, sensing scales, child placement, body), with the cost
#      of a move of one cell unchanged.
#   2. The references' population counters read 999,9xx: their worlds sit
#      at a ceiling with food to spare. Food was raised and spread (25
#      sources of sigma 15 on an 80-unit torus, a total power of 949,000,
#      three times contact-world's) and the ceiling set to 2^18.
#   3. Bodies one organism-spacing wide (diameter 0.25) keep contact-world's
#      labyrinths, rims and tubes; packing them harder (stiffness 1, half
#      the adhesion, or the contact-inhibition variant) smooths them away.
#   4. Children placed up to 2.5 units from the parent, and a torus of 80
#      units, let the colonies fill the torus instead of leaving most of it
#      black: distance 0.74 against the corrected reference, the nearest of
#      any sample (contact-world 1.27, tissue-world 0.78-1.00).
#   5. It was chosen by eye, coloured by lineage, against the references.
#
# Scale: 10,954 founders on an 80 x 80 periodic torus with a 320 x 320
# field, a population ceiling of 262,144 (2.6 organisms per field cell)
# under refuse-excess-births-v1 (plan §7.5's exhibition policy), and F16
# canonical controller weights evaluated every tick at Δt = 1/32 s.
#
# It is presets/contact-world.toml with exactly these changes:
#
#   name                                               contact-world → confluent-world
#   world.width                                        128.0 → 80.0
#   world.height                                       128.0 → 80.0
#   world.grid_width                                   128 → 320
#   world.grid_height                                  128 → 320
#   world.diffusion                                    0.477947 → 0.0298717
#   population.maximum_count                           177536 → 262144
#   sources.count                                      64 → 25
#   sources.power_per_source                           4941.03 → 37970.7
#   sources.sigma_world_units                          7.48417 → 14.9683
#   chemistry.motion_response_norm_limit               100.46 → 6.27875
#   chemistry.maximum_acceleration                     19.8961 → 4.97403
#   chemistry.maximum_speed                            13.7045 → 3.42612
#   sensors.gradient_length_scale_world_units          1.0 → 0.25
#   sensors.velocity_scale                             4.0 → 1.0
#   sensors.initial_scale_world_units                  1.0 → 0.25
#   sensors.minimum_scale_world_units                  1.0 → 0.25
#   sensors.maximum_scale_world_units                  16.0 → 4.0
#   costs.sensor_unit_scale_world_units                1.0 → 0.25
#   costs.motion_energy_per_speed_squared_second       0.000451687 → 0.00722699
#   reproduction.child_position_offset_radius          0.45 → 2.5
#   contact.diameter                                   0.45 → 0.25

schema = "frankenlife.config.v1"
name = "confluent-world"
model = "field-ecology-v1-contact"
seed = 42

[world]
width = 80.0
height = 80.0
grid_width = 320
grid_height = 320
boundary = "periodic"
moment_channels = 32
field_dtype = "f32"
tick_numerator = 1
tick_denominator = 32
transport_scheme = "positive-five-point-v1"
diffusion = 0.0298717
decay_per_second = 0.0818013
stability_policy = "subcycle"
exchange_kernel = "grid-cic-v1"
tiny_energy_policy = "dissipate-and-record"
tiny_energy_threshold = 1.0e-12

[population]
initial_count = 10954
maximum_count = 262144
initial_energy = 2.0
initial_velocity = "zero"
initial_positions = "uniform"
capacity_policy = "refuse-excess-births-v1"
automatic_reseed = false

[field_initialization]
energy_per_cell = 0.0
composition = "zero"

[sources]
count = 25
power_per_source = 37970.7
sigma_world_units = 14.9683
spatial_normalization = "fixed-total-power"
kernel = "normalized-truncated-minimum-image-gaussian-v1"
kernel_cutoff_sigma = 4.0
chemical_directions = "seeded-unit-vectors"
chemical_direction_policy = "fixed-per-source"
path = "seeded-smooth-torus-v1"
path_speed = 6.41031
path_direction_interval_seconds = 30.0

[chemistry]
family = "bounded-affinity-v1"
heritable_traits = ["affinity_direction", "motion_response", "sensing_scale"]
maximum_efficiency = 0.777059
affinity_norm_limit = 1.0
affinity_gain = 14.5263
discrimination_threshold = 0.265017
uptake_capacity_per_second = 2.94923
uptake_half_saturation_density = 0.805307
toxicity_sensitivity = 0.0800432
chemistry_evaluation = "per-granted-cell-packet"
motion_response_norm_limit = 6.27875
maximum_acceleration = 4.97403
drag_per_second = 0.608376
maximum_speed = 3.42612

[sensors]
schema = "energy-moment-gradient-104-v1"
normalization = "fixed-local-scales-v1"
energy_density_scale = 8.0
gradient_length_scale_world_units = 0.25
composition_energy_floor_density = 1.0e-6
internal_energy_scale = 4.0
age_scale_seconds = 60.0
velocity_scale = 1.0
energy_change_scale_per_second = 1.0
initial_scale_world_units = 0.25
minimum_scale_world_units = 0.25
maximum_scale_world_units = 4.0
pyramid_filter = "positive-box-v1"
pyramid_scale_blend = "log-linear-v1"

[controller]
family = "independent-dense-mlp-v1"
input_width = 104
hidden_widths = [64, 32]
output_width = 36
hidden_activation = "tanh"
output_activation = "linear"
canonical_weight_dtype = "f16"
accumulation_dtype = "f32"
evaluation_interval_ticks = 1
phase_policy = "stable-identity"
autograd = false
initializer = "fan-in-scaled-symmetric-v1"
maximum_absolute_parameter = 4.0

[architecture_mutation]
enabled = true
catalog = "dense-104-36-catalog-v1"
maximum_parameters = 30000
probability_per_birth = 0.01
inheritance_map = "overlap-plus-zero-output-v1"
depth_change_map = "prefix-and-identity-bridge-v1"
target_selection = "uniform-other-catalog-member"

[mutation]
rng = "fnp-philox-semantic-v1"
weight_probability = 0.002
weight_standard_deviation = 0.02
replacement_probability = 0.0001
chemistry_standard_deviation = 0.01
sensing_log_scale_standard_deviation = 0.02
reject_effective_noop = true
maximum_candidate_proposals_per_birth = 8
exhausted_proposals_policy = "reject-birth-no-charge"
meta_evolution = false

[costs]
basal_energy_per_second = 0.690777
sensor_energy_per_second_at_unit_scale = 0.001
sensor_unit_scale_world_units = 0.25
sensor_scale_cost_exponent = 1.0
neural_energy_per_parameter_evaluation = 2.0e-9
motion_energy_per_speed_squared_second = 0.00722699
birth_energy = 0.05

[emission]
gate_threshold = 0.355002
maximum_fractional_rate_per_second = 0.97945
transfer_efficiency = 0.95
direction_zero_threshold = 1.0e-8
zero_direction_policy = "no-emission-no-charge"
position = "post-motion"
visibility = "next-tick"

[reproduction]
maximum_attempt_rate_per_second = 1.81041
minimum_parent_energy_before_attempt = 1.77835
minimum_child_energy = 0.3
minimum_parent_energy_after_split = 0.3
minimum_child_fraction = 0.1
maximum_child_fraction = 0.9
cooldown_seconds = 0.0642813
child_position_offset_radius = 2.5
newborn_activation = "next-tick"

[death]
residual_energy_recycle_fraction = 0.525187
corpse_direction = "genetic-affinity"
numerical_fault_policy = "stop-and-preserve"

[contact]
# Plan §5.4: every organism is a body of this diameter; overlapping bodies
# push apart, and bodies near touching pull together as alike as their
# chemistry is.
diameter = 0.25
stiffness = 0.5
adhesion = 1.0
adhesion_range = 1.5

[execution]
backend = "cpu-reference"
determinism = "qualified-reference"
math_mode = "specified"
cpu_workers = 1
command_queue_capacity = 256
control_queue_capacity = 16
command_durability = "volatile-in-memory"
render_queue_capacity = 3
maximum_logical_genome_bytes = 17179869184
maximum_allocated_genome_bytes = 19327352832
maximum_total_bytes = 68719476736
checkpoint_retained_bytes = 134217728
observer_pressure_policy = "drop-observer-or-pause-unchanged-world"

[presentation]
engine = "franken-manim"
width = 1920
height = 1080
frames_per_second = 30
color_mapping = "founder-lineage-v1"
background = "#020308"
point_radius_pixels = 0.8
bloom_enabled = true
bloom_strength = 0.15
trails_enabled = false
interpolation = "committed-states-one-epoch-late"
show_clock_telemetry = true

[recording]
enabled = false
clock = "simulation-time"
include_provenance = true

[persistence]
catalog = "frankensqlite"
checkpoint_mode = "pause-and-stream"
checkpoint_interval_simulation_seconds = 30.0
retain_recent_checkpoints = 4
preserve_pinned_discoveries = true
metrics_interval_ticks = 128
