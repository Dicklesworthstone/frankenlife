# showcase-world: a world chosen by an outer search for organism-like structure
# (experiments/showcase/README.md, stages 1 and 2).
#
# Category: an outer-searched parameter set (plan §2.4, §7.2, §15.5). A
# search outside the world sampled configurations, ran each one, scored its
# raw frames with an image statistic, and a person chose among the best by
# eye. Nothing the search computed feeds back into a run: the world has no
# aesthetic fitness, and its organisms live, split and die by energy alone,
# as in every preset. It is not a selected seed: the seed is the Desktop
# preset's 42, and held-out seeds show the same character
# (experiments/showcase/README.md). It is neither an evolved population nor
# a viability calibration, and it makes no claim that the world persists
# indefinitely.
#
# The selection (experiments/showcase/README.md has every sample's score;
# experiments/showcase/search.py reruns any of them):
#   1. 300 configurations, each drawing the model (field-ecology-v1 or
#      field-ecology-v1-ungated-motion) and 26 parameters at random, each run
#      on a 128 × 128 world at Δt = 1/32 s for 1,600 ticks and scored from
#      raw-dot frames: power at wavelengths of 4–16 cells over the shot-noise
#      level, times motion.
#   2. 110 perturbations of 8 parents a person chose by eye from stage 1's
#      14 best: every number times a factor in [0.7, 1.4], and the source
#      count times 1, 2, 4 or 8 at the same total power.
#   3. A person chose sample s1000 (13th of the 402 scored, by the search's
#      key with coverage) from the best of stage 2 by eye, against the
#      reference screenshots, because its membranes, rings and colonies
#      filled more of the world than those ranked above it.
#   4. This preset is s1000 on 4× the area, so 4× its sources and founders at
#      the same source density, supply per area and organism density.
#
# Scale: 43,816 founders on a 256 × 256 periodic field with 33 F32 planes, a
# population ceiling of 240,000 and F16 canonical controller weights,
# evaluated every tick at Δt = 1/32 s. The longer tick is this preset's
# declared timestep, not a load response (AGENTS.md, rule 4).
#
# Energy throughput: 64 × 3721.77 = 238,193 energy/s, 3.63 per unit area per
# second, six times the Desktop preset's.
#
# It is presets/desktop-world.toml with exactly these changes:
#
#   name                                               desktop-world → showcase-world
#   world.width                                        512.0 → 256.0
#   world.height                                       512.0 → 256.0
#   world.grid_width                                   512 → 256
#   world.grid_height                                  512 → 256
#   world.tick_denominator                             128 → 32
#   world.diffusion                                    0.15 → 0.414856
#   world.decay_per_second                             0.01 → 0.0131865
#   population.initial_count                           100000 → 43816
#   population.maximum_count                           160000 → 240000
#   sources.count                                      128 → 64
#   sources.power_per_source                           1248.0 → 3721.77
#   sources.sigma_world_units                          10.0 → 9.95882
#   sources.path_speed                                 1.0 → 5.3505
#   chemistry.maximum_efficiency                       0.8 → 0.698545
#   chemistry.affinity_gain                            4.0 → 10.9355
#   chemistry.discrimination_threshold                 0.15 → 0.386861
#   chemistry.uptake_capacity_per_second               6.0 → 2.6027
#   chemistry.uptake_half_saturation_density           0.1 → 0.923996
#   chemistry.toxicity_sensitivity                     0.2 → 0.0959457
#   chemistry.motion_response_norm_limit               256.0 → 80.0496
#   chemistry.maximum_acceleration                     4.0 → 28.4759
#   chemistry.drag_per_second                          2.0 → 0.691841
#   chemistry.maximum_speed                            4.0 → 8.49133
#   costs.basal_energy_per_second                      0.8 → 0.81893
#   costs.motion_energy_per_speed_squared_second       0.002 → 0.000864311
#   emission.gate_threshold                            0.5 → 0.468461
#   emission.maximum_fractional_rate_per_second        0.25 → 0.205339
#   emission.transfer_efficiency                       0.9 → 0.630672
#   reproduction.maximum_attempt_rate_per_second       1.0 → 1.61554
#   reproduction.minimum_parent_energy_before_attempt  3.0 → 2.26573
#   reproduction.cooldown_seconds                      0.5 → 0.090866
#   death.residual_energy_recycle_fraction             0.5 → 0.540951
#   execution.maximum_logical_genome_bytes             4294967296 → 6442450944
#   execution.maximum_allocated_genome_bytes           4831838208 → 7247757312
#   execution.maximum_total_bytes                      17179869184 → 34359738368

schema = "frankenlife.config.v1"
name = "showcase-world"
model = "field-ecology-v1"
seed = 42

[world]
width = 256.0
height = 256.0
grid_width = 256
grid_height = 256
boundary = "periodic"
moment_channels = 32
field_dtype = "f32"
tick_numerator = 1
tick_denominator = 32
transport_scheme = "positive-five-point-v1"
diffusion = 0.414856
decay_per_second = 0.0131865
stability_policy = "subcycle"
exchange_kernel = "grid-cic-v1"
tiny_energy_policy = "dissipate-and-record"
tiny_energy_threshold = 1.0e-12

[population]
initial_count = 43816
maximum_count = 240000
initial_energy = 2.0
initial_velocity = "zero"
initial_positions = "uniform"
capacity_policy = "pause-before-commit"
automatic_reseed = false

[field_initialization]
energy_per_cell = 0.0
composition = "zero"

[sources]
count = 64
power_per_source = 3721.77
sigma_world_units = 9.95882
spatial_normalization = "fixed-total-power"
kernel = "normalized-truncated-minimum-image-gaussian-v1"
kernel_cutoff_sigma = 4.0
chemical_directions = "seeded-unit-vectors"
chemical_direction_policy = "fixed-per-source"
path = "seeded-smooth-torus-v1"
path_speed = 5.3505
path_direction_interval_seconds = 30.0

[chemistry]
family = "bounded-affinity-v1"
heritable_traits = ["affinity_direction", "motion_response", "sensing_scale"]
maximum_efficiency = 0.698545
affinity_norm_limit = 1.0
affinity_gain = 10.9355
discrimination_threshold = 0.386861
uptake_capacity_per_second = 2.6027
uptake_half_saturation_density = 0.923996
toxicity_sensitivity = 0.0959457
chemistry_evaluation = "per-granted-cell-packet"
motion_response_norm_limit = 80.0496
maximum_acceleration = 28.4759
drag_per_second = 0.691841
maximum_speed = 8.49133

[sensors]
schema = "energy-moment-gradient-104-v1"
normalization = "fixed-local-scales-v1"
energy_density_scale = 1.0
gradient_length_scale_world_units = 1.0
composition_energy_floor_density = 1.0e-6
internal_energy_scale = 4.0
age_scale_seconds = 60.0
velocity_scale = 4.0
energy_change_scale_per_second = 1.0
initial_scale_world_units = 1.0
minimum_scale_world_units = 1.0
maximum_scale_world_units = 16.0
pyramid_filter = "positive-box-v1"
pyramid_scale_blend = "log-linear-v1"

[controller]
family = "independent-dense-mlp-v1"
input_width = 104
hidden_widths = [64, 32]
output_width = 36
hidden_activation = "tanh"
output_activation = "linear"
canonical_weight_dtype = "f16"
accumulation_dtype = "f32"
evaluation_interval_ticks = 1
phase_policy = "stable-identity"
autograd = false
initializer = "fan-in-scaled-symmetric-v1"
maximum_absolute_parameter = 4.0

[architecture_mutation]
enabled = true
catalog = "dense-104-36-catalog-v1"
maximum_parameters = 30000
probability_per_birth = 0.01
inheritance_map = "overlap-plus-zero-output-v1"
depth_change_map = "prefix-and-identity-bridge-v1"
target_selection = "uniform-other-catalog-member"

[mutation]
rng = "fnp-philox-semantic-v1"
weight_probability = 0.002
weight_standard_deviation = 0.02
replacement_probability = 0.0001
chemistry_standard_deviation = 0.01
sensing_log_scale_standard_deviation = 0.02
reject_effective_noop = true
maximum_candidate_proposals_per_birth = 8
exhausted_proposals_policy = "reject-birth-no-charge"
meta_evolution = false

[costs]
basal_energy_per_second = 0.81893
sensor_energy_per_second_at_unit_scale = 0.001
sensor_unit_scale_world_units = 1.0
sensor_scale_cost_exponent = 1.0
neural_energy_per_parameter_evaluation = 2.0e-9
motion_energy_per_speed_squared_second = 0.000864311
birth_energy = 0.05

[emission]
gate_threshold = 0.468461
maximum_fractional_rate_per_second = 0.205339
transfer_efficiency = 0.630672
direction_zero_threshold = 1.0e-8
zero_direction_policy = "no-emission-no-charge"
position = "post-motion"
visibility = "next-tick"

[reproduction]
maximum_attempt_rate_per_second = 1.61554
minimum_parent_energy_before_attempt = 2.26573
minimum_child_energy = 0.3
minimum_parent_energy_after_split = 0.3
minimum_child_fraction = 0.1
maximum_child_fraction = 0.9
cooldown_seconds = 0.090866
child_position_offset_radius = 0.25
newborn_activation = "next-tick"

[death]
residual_energy_recycle_fraction = 0.540951
corpse_direction = "genetic-affinity"
numerical_fault_policy = "stop-and-preserve"

[execution]
backend = "cpu-reference"
determinism = "qualified-reference"
math_mode = "specified"
cpu_workers = 1
command_queue_capacity = 256
control_queue_capacity = 16
command_durability = "volatile-in-memory"
render_queue_capacity = 3
maximum_logical_genome_bytes = 6442450944
maximum_allocated_genome_bytes = 7247757312
maximum_total_bytes = 34359738368
checkpoint_retained_bytes = 134217728
observer_pressure_policy = "drop-observer-or-pause-unchanged-world"

[presentation]
engine = "franken-manim"
width = 1920
height = 1080
frames_per_second = 30
color_mapping = "founder-lineage-v1"
background = "#020308"
point_radius_pixels = 0.8
bloom_enabled = true
bloom_strength = 0.15
trails_enabled = false
interpolation = "committed-states-one-epoch-late"
show_clock_telemetry = true

[recording]
enabled = false
clock = "simulation-time"
include_provenance = true

[persistence]
catalog = "frankensqlite"
checkpoint_mode = "pause-and-stream"
checkpoint_interval_simulation_seconds = 30.0
retain_recent_checkpoints = 4
preserve_pinned_discoveries = true
metrics_interval_ticks = 128
