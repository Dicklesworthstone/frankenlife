[package]
name = "flife-cli"
description = "FrankenLife's headless command line: preset validation, headless runs through the Asupersync session owner and checkpointed, resumable run directories, with versioned NDJSON records of births, deaths, emissions and heritable variation read from raw state"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "flife"
path = "src/main.rs"

[dependencies]
asupersync.workspace = true
clap.workspace = true
flife-backend-metal = { path = "../flife-backend-metal" }
flife-core = { path = "../flife-core" }
flife-engine = { path = "../flife-engine" }
flife-genome = { path = "../flife-genome" }
flife-manim = { path = "../flife-manim" }
flife-render = { path = "../flife-render" }
flife-runtime = { path = "../flife-runtime" }
flife-store = { path = "../flife-store" }
fmn-codec.workspace = true
serde.workspace = true
serde_json.workspace = true
# Experiment specifications (FL-041) are TOML, and their overrides are
# applied to the base configuration's TOML before it is validated.
toml.workspace = true

[dev-dependencies]
peak_alloc.workspace = true
# The frame-route measurement example renders on FrankenManim's Metal route.
fmn-render = { workspace = true, features = ["metal"] }

[lints]
workspace = true
