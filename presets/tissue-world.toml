# tissue-world: a world chosen by an outer search for organism-like structure
# (the website's film until contact-world).
#
# Category: an outer-searched parameter set (plan §2.4, §7.2, §15.5), like
# presets/showcase-world.toml and presets/colony-world.toml, whose search it
# continues. A search outside the world ran configurations, scored their raw
# frames against image statistics of the reference screenshots, and a person
# chose among the closest by eye. Nothing the search computed feeds back into
# a run: the world has no aesthetic fitness, and its organisms live, split,
# emit and die by energy alone. It is not a selected seed (the Desktop
# preset's 42; held-out seeds show the same character), not an evolved
# population and not a viability calibration, and it makes no claim that the
# world persists indefinitely.
#
# The selection (experiments/showcase/README.md, "Stage W", has every step;
# experiments/showcase/match.py scores any frame; tissue.json records the
# chosen sample and its ancestry):
#   1. Stage W scored each 128 x 128 sample by its distance from 14 image
#      statistics of the reference screenshots, and chose colony-world's
#      sample e4-r8-d1-k8-w0 (distance 1.01): strong emission, whose
#      composition each lineage's networks choose alike, grows single-colour
#      colonies.
#   2. A sweep of that sample's ceiling (x1, 2, 4) and food supply (x1, 2, 4)
#      found sample c4-x1 closest (distance 0.76, the closest of Stage W's
#      133 scored): the ceiling x4 at the same supply. There the ceiling no
#      longer binds; food holds the population near 5-9 organisms a cell, and
#      the colonies merge into a nearly continuous, multicoloured tissue.
#      More food at that ceiling filled it and moved less (1.18, 1.60).
#   3. A person chose c4-x1 by eye against the references.
#   4. This preset is that sample itself, at its own 128 x 128 scale, with
#      genome quotas raised so the worst case fits: no hidden genome-size limit
#      selects.
#
# Scale: 10,954 founders on a 128 x 128 periodic field with 33 F32 planes, a
# population ceiling of 177,536 (10.8 per cell) under refuse-excess-births-v1
# (plan §7.5's exhibition policy), and F16 canonical controller weights
# evaluated every tick at Δt = 1/32 s.
#
# Energy throughput: 64 x 4941.03 = 316,226 energy/s, 19.3 per unit area per
# second.
#
# It is presets/desktop-world.toml with exactly these changes:
#
#   name                                               desktop-world → tissue-world
#   world.width                                        512.0 → 128.0
#   world.height                                       512.0 → 128.0
#   world.grid_width                                   512 → 128
#   world.grid_height                                  512 → 128
#   world.tick_denominator                             128 → 32
#   world.diffusion                                    0.15 → 0.477947
#   world.decay_per_second                             0.01 → 0.0818013
#   population.initial_count                           100000 → 10954
#   population.maximum_count                           160000 → 177536
#   population.capacity_policy                         pause-before-commit → refuse-excess-births-v1
#   sources.count                                      128 → 64
#   sources.power_per_source                           1248.0 → 4941.03
#   sources.sigma_world_units                          10.0 → 7.48417
#   sources.path_speed                                 1.0 → 6.41031
#   chemistry.maximum_efficiency                       0.8 → 0.777059
#   chemistry.affinity_gain                            4.0 → 14.5263
#   chemistry.discrimination_threshold                 0.15 → 0.265017
#   chemistry.uptake_capacity_per_second               6.0 → 2.94923
#   chemistry.uptake_half_saturation_density           0.1 → 0.805307
#   chemistry.toxicity_sensitivity                     0.2 → 0.0800432
#   chemistry.motion_response_norm_limit               256.0 → 100.46
#   chemistry.maximum_acceleration                     4.0 → 19.8961
#   chemistry.drag_per_second                          2.0 → 0.608376
#   chemistry.maximum_speed                            4.0 → 13.7045
#   sensors.energy_density_scale                       1.0 → 8.0
#   costs.basal_energy_per_second                      0.8 → 0.690777
#   costs.motion_energy_per_speed_squared_second       0.002 → 0.000451687
#   emission.gate_threshold                            0.5 → 0.355002
#   emission.maximum_fractional_rate_per_second        0.25 → 0.97945
#   emission.transfer_efficiency                       0.9 → 0.95
#   reproduction.maximum_attempt_rate_per_second       1.0 → 1.81041
#   reproduction.minimum_parent_energy_before_attempt  3.0 → 1.77835
#   reproduction.cooldown_seconds                      0.5 → 0.0642813
#   death.residual_energy_recycle_fraction             0.5 → 0.525187
#   execution.maximum_logical_genome_bytes             4294967296 → 17179869184
#   execution.maximum_allocated_genome_bytes           4831838208 → 19327352832
#   execution.maximum_total_bytes                      17179869184 → 68719476736

schema = "frankenlife.config.v1"
name = "tissue-world"
model = "field-ecology-v1"
seed = 42

[world]
width = 128.0
height = 128.0
grid_width = 128
grid_height = 128
boundary = "periodic"
moment_channels = 32
field_dtype = "f32"
tick_numerator = 1
tick_denominator = 32
transport_scheme = "positive-five-point-v1"
diffusion = 0.477947
decay_per_second = 0.0818013
stability_policy = "subcycle"
exchange_kernel = "grid-cic-v1"
tiny_energy_policy = "dissipate-and-record"
tiny_energy_threshold = 1.0e-12

[population]
initial_count = 10954
maximum_count = 177536
initial_energy = 2.0
initial_velocity = "zero"
initial_positions = "uniform"
capacity_policy = "refuse-excess-births-v1"
automatic_reseed = false

[field_initialization]
energy_per_cell = 0.0
composition = "zero"

[sources]
count = 64
power_per_source = 4941.03
sigma_world_units = 7.48417
spatial_normalization = "fixed-total-power"
kernel = "normalized-truncated-minimum-image-gaussian-v1"
kernel_cutoff_sigma = 4.0
chemical_directions = "seeded-unit-vectors"
chemical_direction_policy = "fixed-per-source"
path = "seeded-smooth-torus-v1"
path_speed = 6.41031
path_direction_interval_seconds = 30.0

[chemistry]
family = "bounded-affinity-v1"
heritable_traits = ["affinity_direction", "motion_response", "sensing_scale"]
maximum_efficiency = 0.777059
affinity_norm_limit = 1.0
affinity_gain = 14.5263
discrimination_threshold = 0.265017
uptake_capacity_per_second = 2.94923
uptake_half_saturation_density = 0.805307
toxicity_sensitivity = 0.0800432
chemistry_evaluation = "per-granted-cell-packet"
motion_response_norm_limit = 100.46
maximum_acceleration = 19.8961
drag_per_second = 0.608376
maximum_speed = 13.7045

[sensors]
schema = "energy-moment-gradient-104-v1"
normalization = "fixed-local-scales-v1"
energy_density_scale = 8.0
gradient_length_scale_world_units = 1.0
composition_energy_floor_density = 1.0e-6
internal_energy_scale = 4.0
age_scale_seconds = 60.0
velocity_scale = 4.0
energy_change_scale_per_second = 1.0
initial_scale_world_units = 1.0
minimum_scale_world_units = 1.0
maximum_scale_world_units = 16.0
pyramid_filter = "positive-box-v1"
pyramid_scale_blend = "log-linear-v1"

[controller]
family = "independent-dense-mlp-v1"
input_width = 104
hidden_widths = [64, 32]
output_width = 36
hidden_activation = "tanh"
output_activation = "linear"
canonical_weight_dtype = "f16"
accumulation_dtype = "f32"
evaluation_interval_ticks = 1
phase_policy = "stable-identity"
autograd = false
initializer = "fan-in-scaled-symmetric-v1"
maximum_absolute_parameter = 4.0

[architecture_mutation]
enabled = true
catalog = "dense-104-36-catalog-v1"
maximum_parameters = 30000
probability_per_birth = 0.01
inheritance_map = "overlap-plus-zero-output-v1"
depth_change_map = "prefix-and-identity-bridge-v1"
target_selection = "uniform-other-catalog-member"

[mutation]
rng = "fnp-philox-semantic-v1"
weight_probability = 0.002
weight_standard_deviation = 0.02
replacement_probability = 0.0001
chemistry_standard_deviation = 0.01
sensing_log_scale_standard_deviation = 0.02
reject_effective_noop = true
maximum_candidate_proposals_per_birth = 8
exhausted_proposals_policy = "reject-birth-no-charge"
meta_evolution = false

[costs]
basal_energy_per_second = 0.690777
sensor_energy_per_second_at_unit_scale = 0.001
sensor_unit_scale_world_units = 1.0
sensor_scale_cost_exponent = 1.0
neural_energy_per_parameter_evaluation = 2.0e-9
motion_energy_per_speed_squared_second = 0.000451687
birth_energy = 0.05

[emission]
gate_threshold = 0.355002
maximum_fractional_rate_per_second = 0.97945
transfer_efficiency = 0.95
direction_zero_threshold = 1.0e-8
zero_direction_policy = "no-emission-no-charge"
position = "post-motion"
visibility = "next-tick"

[reproduction]
maximum_attempt_rate_per_second = 1.81041
minimum_parent_energy_before_attempt = 1.77835
minimum_child_energy = 0.3
minimum_parent_energy_after_split = 0.3
minimum_child_fraction = 0.1
maximum_child_fraction = 0.9
cooldown_seconds = 0.0642813
child_position_offset_radius = 0.25
newborn_activation = "next-tick"

[death]
residual_energy_recycle_fraction = 0.525187
corpse_direction = "genetic-affinity"
numerical_fault_policy = "stop-and-preserve"

[execution]
backend = "cpu-reference"
determinism = "qualified-reference"
math_mode = "specified"
cpu_workers = 1
command_queue_capacity = 256
control_queue_capacity = 16
command_durability = "volatile-in-memory"
render_queue_capacity = 3
maximum_logical_genome_bytes = 17179869184
maximum_allocated_genome_bytes = 19327352832
maximum_total_bytes = 68719476736
checkpoint_retained_bytes = 134217728
observer_pressure_policy = "drop-observer-or-pause-unchanged-world"

[presentation]
engine = "franken-manim"
width = 1920
height = 1080
frames_per_second = 30
color_mapping = "founder-lineage-v1"
background = "#020308"
point_radius_pixels = 0.8
bloom_enabled = true
bloom_strength = 0.15
trails_enabled = false
interpolation = "committed-states-one-epoch-late"
show_clock_telemetry = true

[recording]
enabled = false
clock = "simulation-time"
include_provenance = true

[persistence]
catalog = "frankensqlite"
checkpoint_mode = "pause-and-stream"
checkpoint_interval_simulation_seconds = 30.0
retain_recent_checkpoints = 4
preserve_pinned_discoveries = true
metrics_interval_ticks = 128
