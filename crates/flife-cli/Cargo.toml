[package]
name = "flife-cli"
description = "FrankenLife's headless command line: preset validation and a headless run through the Asupersync session owner, with versioned NDJSON records of births, deaths, emissions and heritable variation read from raw state"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "flife"
path = "src/main.rs"

[dependencies]
asupersync.workspace = true
clap.workspace = true
flife-backend-metal = { path = "../flife-backend-metal" }
flife-core = { path = "../flife-core" }
flife-engine = { path = "../flife-engine" }
flife-genome = { path = "../flife-genome" }
flife-manim = { path = "../flife-manim" }
flife-render = { path = "../flife-render" }
flife-runtime = { path = "../flife-runtime" }
fmn-codec.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
toml.workspace = true

[lints]
workspace = true
