[workspace]
resolver = "3"
# Create only the crates each milestone needs (plan §18.1): FL-001's capability
# probes, FL-002's core contracts, FL-003–FL-005's field, FL-006's
# organism-phase operators, FL-007's sensor/action ABI, FL-009's genomes,
# FL-014's session owner, FL-015's headless command line, FL-017's render
# epochs, FL-018's FrankenManim world adapter and native Studio host, and
# FL-030's fused Metal controller kernel, and FL-035's checkpoint chunk store.
members = [
    "crates/flife-backend-metal",
    "crates/flife-cli",
    "crates/flife-core",
    "crates/flife-engine",
    "crates/flife-field",
    "crates/flife-genome",
    "crates/flife-manim",
    "crates/flife-neural",
    "crates/flife-probes",
    "crates/flife-render",
    "crates/flife-runtime",
    "crates/flife-store",
    "crates/flife-studio",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/frankenlife"
publish = false

# The qualified dependency closure (FL-001, plan §12.8, §18.5). Every
# FrankenSuite dependency enters as a git dependency at the exact commit that
# franken-stack.lock records; the closure probe in crates/flife-probes fails
# when Cargo.lock resolves anything else, or a second copy of a suite package.
[workspace.dependencies]
# Asupersync v0.6.2 (crates.io 0.6.2), the same git source FrankenManim's
# governed closure requires, so FrankenLife and Manim share one package id.
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "a5d23e8dd2c8d776bd02e2da8e38e6296600e84c", default-features = false }
fmn = { git = "https://github.com/Dicklesworthstone/franken_manim", rev = "721b04b9ceb8d7ec4b955b6cf81d224a32180e88" }
# FrankenManim's camera, 3D job and Metal preview, for FL-018's world adapter
# and Studio host. Already in the closure through fmn; named directly because
# the umbrella does not re-export the renderer's Metal route.
fmn-core = { git = "https://github.com/Dicklesworthstone/franken_manim", rev = "721b04b9ceb8d7ec4b955b6cf81d224a32180e88" }
fmn-render = { git = "https://github.com/Dicklesworthstone/franken_manim", rev = "721b04b9ceb8d7ec4b955b6cf81d224a32180e88" }
# Offline frames (`flife render`): Rgba16F to sRGB RGBA8, and PNG.
fmn-frame = { git = "https://github.com/Dicklesworthstone/franken_manim", rev = "721b04b9ceb8d7ec4b955b6cf81d224a32180e88" }
fmn-codec = { git = "https://github.com/Dicklesworthstone/franken_manim", rev = "721b04b9ceb8d7ec4b955b6cf81d224a32180e88" }
fnp-dtype = { git = "https://github.com/Dicklesworthstone/franken_numpy", rev = "6492ff310c45ad72abf27e4394f68b9059770193" }
fnp-ndarray = { git = "https://github.com/Dicklesworthstone/franken_numpy", rev = "6492ff310c45ad72abf27e4394f68b9059770193" }
fnp-random-core = { git = "https://github.com/Dicklesworthstone/franken_numpy", rev = "6492ff310c45ad72abf27e4394f68b9059770193" }
# NumPy-exact Philox4x64-10 for fnp-philox-semantic-v1 (FL-010). At this commit
# fnp-random does not build without its default features (ndarray, getrandom,
# rayon), so they stay on; all three were already in the closure. FrankenLife
# never calls its entropy constructors or parallel fills.
fnp-random = { git = "https://github.com/Dicklesworthstone/franken_numpy", rev = "6492ff310c45ad72abf27e4394f68b9059770193" }
# FrankenSQLite (FL-036): the run catalog and command journal. Only the
# native file-backed engine; no io_uring backend and no SQL extensions.
fsqlite = { git = "https://github.com/Dicklesworthstone/frankensqlite", rev = "074c2033b4dd5212bf2f6c6aa80480ff711dfd9f", default-features = false, features = ["native"] }
ft-api = { package = "frankentorch-api", git = "https://github.com/Dicklesworthstone/frankentorch", rev = "c22e1415fc5d3c2eb2accf87c9f8904a047900db" }
ft-core = { package = "frankentorch-core", git = "https://github.com/Dicklesworthstone/frankentorch", rev = "c22e1415fc5d3c2eb2accf87c9f8904a047900db" }
ft-kernel-metal = { git = "https://github.com/Dicklesworthstone/frankentorch", rev = "c22e1415fc5d3c2eb2accf87c9f8904a047900db" }
ft-runtime = { package = "frankentorch-runtime", git = "https://github.com/Dicklesworthstone/frankentorch", rev = "c22e1415fc5d3c2eb2accf87c9f8904a047900db", features = ["asupersync-integration"] }

# Third-party crates. serde and sha2 0.11 are already in the qualified closure;
# toml is the one addition, for flife-core's config loader (Appendix A is TOML,
# and the loader must refuse unknown keys) and flife-cli's experiment
# specifications (FL-041). clap and serde_json, for
# flife-cli's arguments and NDJSON records (FL-015), were already in the
# closure, so they add no package.
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }
# Test only (FL-038): a global allocator that counts the bytes live and their
# high-water mark, for the checkpoint path's peak-memory tests. No dependencies;
# its unsafe allocator impl stays in the crate, never in FrankenLife code.
peak_alloc = "=0.3.0"

# Root-only overrides. Cargo reads [patch] only at the consuming workspace
# root and ignores a dependency's own patches (plan §12.8, S20), so each one
# FrankenLife needs is carried here and recorded in franken-stack.lock.
[patch.crates-io]
# FrankenTorch takes asupersync 0.6.2 from crates.io, FrankenManim from git.
# Without this patch the closure holds two asupersync packages, and their
# Budget, Cx and region types do not unify.
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync", rev = "a5d23e8dd2c8d776bd02e2da8e38e6296600e84c" }
# The reviewed block 0.1.6 fork that metal 0.33 needs: it models the external
# Objective-C class symbol by raw address instead of an uninhabited extern
# static. Same revision as FrankenManim's SUITE.lock [patches] row.
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }

# Tests run optimized. FL-015's smoke test runs the real 4,096-organism preset
# for 1,024 ticks, and unoptimized a tick at that scale takes about 40 times
# longer. Optimization does not change results: Rust floating point has no
# fast-math and no implicit FMA contraction, so every pinned digest is the
# same at every opt-level. Debug assertions and overflow checks stay on.
[profile.test]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

# AGENTS.md: unwrap/expect/panic are denied in production code; clippy.toml
# re-allows them in tests. `cargo clippy -- -D warnings` makes the rest gates.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# An eagerly built error message in a hot loop cost 13% of every tick
# (`format!` inside `ok_or`), so build fallbacks lazily.
or_fun_call = "deny"
