# The polarity film's world (web/lib/films/confluent-polarity.json): presets/confluent-world.toml as
# field-ecology-v2 with one v2 mechanism on, pcp-polarity, at the engine's default parameters. This is
# the config.toml flife wrote into the run directory when it was founded with
#   flife run confluent-v2-base.toml --disable all-v2 --enable pcp-polarity
# where confluent-v2-base.toml is presets/confluent-world.toml with name = "confluent-v2-base" and
# model = "field-ecology-v2". Its config_hash is 01eb3276...; running it reaches digest 49a1ef81... at
# tick 2,400, where the film starts:
#   flife run experiments/website-films/confluent-polarity.toml --ticks 2400 --run-dir RUN
# With every v2 mechanism off (--v1-compat) the same world reaches the confluent film's own 3f279f51...

schema = "frankenlife.config.v1"
name = "confluent-v2-base"
model = "field-ecology-v2"
seed = 42

[world]
width = 80.0
height = 80.0
grid_width = 320
grid_height = 320
boundary = "periodic"
moment_channels = 32
field_dtype = "f32"
tick_numerator = 1
tick_denominator = 32
transport_scheme = "positive-five-point-v1"
diffusion = 0.0298717
decay_per_second = 0.0818013
stability_policy = "subcycle"
exchange_kernel = "grid-cic-v1"
tiny_energy_policy = "dissipate-and-record"
tiny_energy_threshold = 1e-12

[population]
initial_count = 10954
maximum_count = 262144
initial_energy = 2.0
initial_velocity = "zero"
initial_positions = "uniform"
capacity_policy = "refuse-excess-births-v1"
automatic_reseed = false

[field_initialization]
energy_per_cell = 0.0
composition = "zero"

[sources]
