[package]
name = "flife-backend-cpu"
description = "FrankenLife's CPU controller backend: every due organism's own controller through FrankenTorch's serial population kernel, bit-identical to the reference controller, on the world's own CPU lanes"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
flife-core = { path = "../flife-core" }
flife-neural = { path = "../flife-neural" }
ft-kernel-cpu.workspace = true

[dev-dependencies]
flife-engine = { path = "../flife-engine" }
# Only to hold every rayon worker while the backend runs, proving it needs
# none. rayon 1.12.0 is already in the closure (via FrankenTorch, FrankenNumPy
# and FrankenSciPy), so this adds no package.
rayon = "1.12"

[lints]
workspace = true
