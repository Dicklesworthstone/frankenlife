# franken-stack.lock — FrankenLife's qualified dependency closure
# (FL-001 / flife-nw7, plan §12.8 and §18.5).
#
# Every FrankenSuite repository that Cargo.lock resolves is pinned here, with
# the root patches FrankenLife carries and the capability probes that
# qualified the combination. crates/flife-probes enforces the pins: its
# closure probe fails if Cargo.lock resolves a suite repository at any other
# commit, at two commits, or holds a second copy of a single-copy package
# (asupersync, ft-kernel-metal, fnp-random, fnp-random-core, block and the rest).
#
# Moving a pin is deliberate. Change it here and in Cargo.toml in one commit,
# re-run `flife-probe` on every qualified host, and replace that host's
# [probes] rows with the new results, recording the old ones in the commit
# message. Line format: section-tagged, tab-separated.

[toolchain]
rustc	nightly-2026-08-31
edition	2024

